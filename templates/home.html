{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TODO LIST - Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1">

</head>
<body>
    <div class="container">
        <h3 class="pt-5 text-center">Django ToDo App</h3>

        <div class="row">
            <h4>My Day</h4>
            <p class="text-muted">{% now "jS F Y" %}</p>

            <div class="col-md-7" style="height:450px; overflow:auto;">
                {% for task in tasks %}
                <div class="card m-1">
                    <div class="card-body">
                      {{ task.task }}
                        <span class="float-end">
                            <a class="btn btn-success">
                                <i class="fa fa-check"></i> Mark as Done
                            </a>
                            <a class="btn btn-danger">
                                <i class="fa fa-trash"></i>
                            </a>
                            <a class="btn btn-primary">
                                <i class="fa fa-pencil"></i>
                            </a>
                        </span>
                    </div>
                </div>
                {% empty %}
                <p>No tasks yet</p>
                 {% endfor %}
            </div>

            <div class="col-md-5">
                <h5>Completed Tasks</h5>
                <div class="card m-1">
                    <div class="card-body">
                        This is the completed task.
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 p-0" style="position: fixed; bottom: 50px;">
                <form action="{% url 'addTask' %}" method="POST">
                    {% csrf_token %}
        
                    <div class="form-group d-flex">
                        <input type="text" name="task" class="form-control" placeholder="Add a task" name="task">
                        <button type="submit" class="btn btn-primary ms-2" style="width:200px;">
                            <i class="fa fa-plus"></i> Add
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
